[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qingyue-zhiheng-backend"
version = "1.0.0"
description = "FastAPI backend for 青跃智衡 (Qingyue Zhiheng)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "uvicorn>=0.34.0",
  "mediapipe>=0.10.9",
  "opencv-python>=4.9.0",
  "numpy>=1.26.0",
  "openpyxl>=3.1.0",
  "anthropic>=0.40.0",
  "tenacity>=9.0.0",
  "alembic>=1.14.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
