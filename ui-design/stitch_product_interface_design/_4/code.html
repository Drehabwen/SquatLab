<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed-variant": "#004395",
                    "surface-variant": "#e3e2e0",
                    "secondary-fixed-dim": "#ffb95f",
                    "on-tertiary-container": "#00377d",
                    "tertiary-fixed-dim": "#adc6ff",
                    "on-primary": "#ffffff",
                    "error": "#ba1a1a",
                    "on-primary-fixed-variant": "#005048",
                    "on-secondary-fixed": "#2a1700",
                    "on-secondary": "#ffffff",
                    "background": "#faf9f6",
                    "on-surface": "#1a1c1a",
                    "surface-container-highest": "#e3e2e0",
                    "on-background": "#1a1c1a",
                    "surface-bright": "#faf9f6",
                    "inverse-on-surface": "#f2f1ee",
                    "tertiary-fixed": "#d8e2ff",
                    "on-error-container": "#93000a",
                    "surface-container-high": "#e9e8e5",
                    "on-tertiary-fixed": "#001a42",
                    "on-error": "#ffffff",
                    "surface-container-low": "#f4f3f1",
                    "primary-fixed-dim": "#4fdbc8",
                    "secondary-fixed": "#ffddb8",
                    "tertiary-container": "#75a3ff",
                    "inverse-primary": "#4fdbc8",
                    "surface-dim": "#dbdad7",
                    "tertiary": "#005ac2",
                    "secondary-container": "#fea619",
                    "surface-tint": "#006b5f",
                    "on-tertiary": "#ffffff",
                    "primary-fixed": "#71f8e4",
                    "surface": "#faf9f6",
                    "error-container": "#ffdad6",
                    "outline": "#6c7a77",
                    "outline-variant": "#bbcac6",
                    "inverse-surface": "#2f312f",
                    "on-primary-container": "#00423b",
                    "on-secondary-fixed-variant": "#653e00",
                    "on-surface-variant": "#3c4947",
                    "secondary": "#855300",
                    "primary": "#006b5f",
                    "primary-container": "#14b8a6",
                    "surface-container": "#efeeeb",
                    "on-secondary-container": "#684000",
                    "on-primary-fixed": "#00201c"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased mb-24">
<!-- TopAppBar from JSON -->
<header class="fixed top-0 w-full z-50 bg-[#faf9f6]">
<div class="flex justify-between items-center px-6 py-4 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#006b5f]">analytics</span>
<h1 class="font-['Manrope'] font-semibold text-xl tracking-[-0.02em] text-[#006b5f]">SquatLab</h1>
</div>
<div class="flex items-center gap-4">
<button class="hover:bg-[#f4f3f1] transition-colors p-2 rounded-full active:scale-95 duration-100">
<span class="material-symbols-outlined text-[#006b5f]">settings</span>
</button>
</div>
</div>
<div class="bg-[#f4f3f1] h-[1px] w-full absolute bottom-0"></div>
</header>
<main class="pt-24 px-6 max-w-3xl mx-auto space-y-10">
<!-- Header Section -->
<section>
<h2 class="font-headline font-extrabold text-4xl tracking-tighter text-on-surface">设置</h2>
<p class="text-on-surface-variant mt-2 max-w-md">优化您的临床环境和评估精度。</p>
</section>
<!-- Environment Configuration -->
<section class="space-y-6">
<div class="flex items-center gap-2">
<span class="text-primary font-bold text-xs uppercase tracking-[0.08em]">环境配置</span>
</div>
<div class="space-y-4">
<!-- Camera Selection -->
<div class="bg-surface-container-low p-6 rounded-xl space-y-4">
<label class="block font-semibold text-on-surface">摄像头选择</label>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
<button class="flex items-center justify-between px-4 py-3 bg-surface-container-lowest border border-primary/20 rounded-lg text-primary font-medium">
<span>FaceTime 高清摄像头</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-surface-container-lowest/50 text-on-surface-variant rounded-lg hover:bg-surface-container-lowest transition-all">
<span>外部 USB 摄像头</span>
<span class="material-symbols-outlined">radio_button_unchecked</span>
</button>
</div>
</div>
<!-- API Endpoint -->
<div class="bg-surface-container-low p-6 rounded-xl space-y-4">
<label class="block font-semibold text-on-surface">API 终端</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-on-surface-variant px-4 py-3 rounded-xl transition-colors" type="text" value="https://api.squatlab.clinical/v1/analyze"/>
<span class="material-symbols-outlined absolute right-4 top-3.5 text-outline text-sm">edit</span>
</div>
<p class="text-[11px] text-on-surface-variant/70 italic">用于实时生物力学处理的安全临床终端。</p>
</div>
</div>
</section>
<!-- Threshold Tuning -->
<section class="space-y-6">
<div class="flex items-center gap-2">
<span class="text-primary font-bold text-xs uppercase tracking-[0.08em]">阈值调优</span>
</div>
<div class="bg-surface-container-low p-6 rounded-xl space-y-8">
<!-- Depth Threshold -->
<div class="space-y-4">
<div class="flex justify-between items-end">
<div>
<h4 class="font-semibold text-on-surface">深度阈值</h4>
<p class="text-xs text-on-surface-variant">有效动作偏离平行的角度。</p>
</div>
<span class="text-2xl font-bold text-primary">90°</span>
</div>
<input class="w-full h-1.5 bg-surface-container-highest rounded-full appearance-none cursor-pointer accent-primary" max="110" min="70" type="range" value="90"/>
</div>
<!-- Valgus Sensitivity -->
<div class="space-y-4">
<div class="flex justify-between items-end">
<div>
<h4 class="font-semibold text-on-surface">内扣敏感度</h4>
<p class="text-xs text-on-surface-variant">横向偏移检测限制。</p>
</div>
<span class="text-2xl font-bold text-secondary">0.85</span>
</div>
<input class="w-full h-1.5 bg-surface-container-highest rounded-full appearance-none cursor-pointer accent-secondary" max="1" min="0" step="0.05" type="range" value="0.85"/>
</div>
</div>
</section>
<!-- Data & Privacy -->
<section class="space-y-4">
<div class="flex items-center gap-2">
<span class="text-primary font-bold text-xs uppercase tracking-[0.08em]">数据与隐私</span>
</div>
<div class="bg-surface-container-lowest shadow-[0_12px_32px_-4px_rgba(26,28,26,0.05)] rounded-xl divide-y divide-surface-container-low overflow-hidden">
<div class="flex items-center justify-between p-5">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">cloud_off</span>
</div>
<div>
<p class="font-medium">仅本地处理</p>
<p class="text-xs text-on-surface-variant">不将视频数据上传至云端</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<div class="flex items-center justify-between p-5">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary">shield</span>
</div>
<div>
<p class="font-medium">匿名遥测</p>
<p class="text-xs text-on-surface-variant">帮助改进临床模型</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</section>
<!-- Version & Logo -->
<section class="py-12 flex flex-col items-center gap-4 border-t border-surface-container-low">
<div class="w-16 h-16 bg-surface-container-low rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl">analytics</span>
</div>
<div class="text-center">
<p class="font-headline font-bold text-on-surface">SquatLab 专业版</p>
<p class="text-on-surface-variant text-sm">版本 V1.0 (稳定版)</p>
</div>
<button class="text-primary font-semibold text-sm hover:underline underline-offset-4 decoration-2">检查更新</button>
</section>
</main>
<!-- BottomNavBar from JSON -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 pb-safe bg-[#faf9f6] z-50 rounded-t-none border-t-[0.5px] border-[#bbcac6]/15 shadow-[0_-4px_24px_-2px_rgba(26,28,26,0.03)]">
<!-- Home -->
<div class="flex flex-col items-center justify-center text-[#3c4947] px-5 py-1.5 hover:bg-[#f4f3f1] rounded-xl transition-all active:transform scale-90 duration-200 ease-out cursor-pointer">
<span class="material-symbols-outlined">home_app_logo</span>
<span class="font-['Manrope'] text-[11px] font-medium">首页</span>
</div>
<!-- Session -->
<div class="flex flex-col items-center justify-center text-[#3c4947] px-5 py-1.5 hover:bg-[#f4f3f1] rounded-xl transition-all active:transform scale-90 duration-200 ease-out cursor-pointer">
<span class="material-symbols-outlined">fitness_center</span>
<span class="font-['Manrope'] text-[11px] font-medium">训练</span>
</div>
<!-- History -->
<div class="flex flex-col items-center justify-center text-[#3c4947] px-5 py-1.5 hover:bg-[#f4f3f1] rounded-xl transition-all active:transform scale-90 duration-200 ease-out cursor-pointer">
<span class="material-symbols-outlined">history</span>
<span class="font-['Manrope'] text-[11px] font-medium">历史</span>
</div>
<!-- Settings (Active) -->
<div class="flex flex-col items-center justify-center bg-[#fea619] text-[#684000] rounded-xl px-5 py-1.5 active:transform scale-90 duration-200 ease-out cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-['Manrope'] text-[11px] font-medium">设置</span>
</div>
</nav>
</body></html>
